<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="sproutGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10b981" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" stroke="#10b981" stroke-opacity="0.3" stroke-width="8"/>
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#glow)"/>

  <!-- AI Nodes Circuit Ring Base -->
  <circle cx="256" cy="380" r="64" stroke="#34d399" stroke-width="4" stroke-dasharray="8 8" opacity="0.6"/>
  <circle cx="256" cy="380" r="12" fill="#10b981"/>
  
  <path d="M256 380 L192 380 M256 380 L320 380 M256 380 L256 420" stroke="#34d399" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <circle cx="192" cy="380" r="6" fill="#34d399"/>
  <circle cx="320" cy="380" r="6" fill="#34d399"/>
  <circle cx="256" cy="420" r="6" fill="#34d399"/>

  <!-- Glowing Plant Sprout Leaves with AI Veins -->
  <g filter="url(#shadow)">
    <!-- Main Stem -->
    <path d="M256 380 C256 280 256 220 256 160" stroke="url(#sproutGrad)" stroke-width="20" stroke-linecap="round"/>

    <!-- Left Leaf -->
    <path d="M256 270 C170 260 120 190 140 120 C210 120 250 180 256 270 Z" fill="url(#sproutGrad)"/>
    <path d="M256 270 C210 230 180 180 160 140" stroke="#022c22" stroke-width="4" stroke-linecap="round" opacity="0.5"/>

    <!-- Right Leaf -->
    <path d="M256 230 C342 220 392 150 372 80 C302 80 262 140 256 230 Z" fill="url(#sproutGrad)"/>
    <path d="M256 230 C302 190 332 140 352 100" stroke="#022c22" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Glowing AI Sparkles -->
  <circle cx="370" cy="90" r="10" fill="#fbbf24"/>
  <circle cx="140" cy="130" r="8" fill="#34d399"/>
  <circle cx="256" cy="150" r="9" fill="#fbbf24"/>
</svg>